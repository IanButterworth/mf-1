name: Release

# Publishing a GitHub release for a tag builds the DMG from that tag, signs and notarises it when the
# Developer ID secrets are set, and attaches it with the update feed the app reads.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build again, e.g. v1.6.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: The tag matches VERSION
        run: test "v$(cat VERSION)" = "$TAG"
      - name: Build and test
        run: |
          swift build -c release
          .build/release/mf1-render Sources/MF1/Resources/Banks test
      - name: Signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: scripts/ci-signing.sh
      - name: DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/make-dmg.sh
      - name: Update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          gh release view "$TAG" --json body --jq .body > $RUNNER_TEMP/notes.md
          scripts/make-appcast.sh "build/MF-1-$(cat VERSION).dmg" $RUNNER_TEMP/notes.md
      - name: Attach to the release
        run: |
          DMG="build/MF-1-$(cat VERSION).dmg"
          gh release upload "$TAG" "$DMG" build/appcast.xml --clobber
          gh release download "$TAG" --pattern "$(basename "$DMG")" --dir $RUNNER_TEMP/check
          shasum -a 256 "$DMG" $RUNNER_TEMP/check/*.dmg
          cmp "$DMG" $RUNNER_TEMP/check/*.dmg
      - name: Clean up
        if: always()
        run: |
          rm -f $RUNNER_TEMP/notary.p8
          security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true
