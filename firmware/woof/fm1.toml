# Woof's firmware build settings (fm1-base's tools/build.py)
name = "WOOF"
id_prefix = "FM-1_49"          # package identity: dev FM-1_4900, releases FM-1_49XXYYZZ
usb_manufacturer = "MF-1"
usb_product = "Woof FM-1"
# The engine is iScream's port of MF-1's; the scene is a copy of the desktop app's own C file (tools/gen_dogs.sh).
include = ["dsp", "../iscream/dsp"]
o2 = ["../iscream/dsp/fm.c", "../iscream/dsp/fx.c", "../iscream/dsp/synth.c", "dsp/scene.c"]
o2_cflags = ["-DISC_FASTMATH"]
words = "words.tsv"
ble = false
# the site and firmware hubs (docs/FIRMWARE-JSON.md)
tagline = "a dog show, every key a bark"
repo = "https://github.com/IanButterworth/mf-1"
licence = "MIT"
credits = "Built on fm1-base and felucca-bsp (MPL-2.0); FM engine from msfa (Apache-2.0) by way of MF-1."
author = "The MF-1 authors"
description = "Thirteen dogs, each an FM bark with its own place and mood, and a pixel-art cartoon of the dog that barks, howls and wags as you play. Keys play single barks, repeats, a pack in chorus, or a chase."
tags = ["synth"]
