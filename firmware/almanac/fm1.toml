# Almanac's firmware build settings (fm1-base's tools/build.py)
name = "ALMANAC"
id_prefix = "FM-1_48"          # package identity: dev FM-1_4800, releases FM-1_48XXYYZZ
usb_manufacturer = "MF-1"
usb_product = "Almanac FM-1"
# The engine is iScream's port of MF-1's; the scene is a copy of the desktop app's own C file (tools/gen_months.sh).
include = ["dsp", "../iscream/dsp"]
o2 = ["../iscream/dsp/fm.c", "../iscream/dsp/fx.c", "../iscream/dsp/synth.c", "dsp/scene.c"]
o2_cflags = ["-DISC_FASTMATH"]
words = "words.tsv"
ble = false
# the site and firmware hubs (docs/FIRMWARE-JSON.md)
tagline = "the year as twelve sounds"
repo = "https://github.com/IanButterworth/mf-1"
licence = "MIT"
credits = "Built on fm1-base and felucca-bsp (MPL-2.0); FM engine from msfa (Apache-2.0) by way of MF-1."
author = "The MF-1 authors"
description = "Twelve months as twelve FM voices, each with its own weather, place and mood, and a pixel-art landscape that rains, snows and blows as you play. Keys play single notes, the month's chord, a split with a drone, or a pattern."
tags = ["synth"]
