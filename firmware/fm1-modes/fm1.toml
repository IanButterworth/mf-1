# MF-1's modes in one firmware: fm1-base's tools/build.py settings
name = "MODES"
id_prefix = "FM-1_50"          # package identity: dev FM-1_5000, releases FM-1_50XXYYZZ
usb_manufacturer = "MF-1"
usb_product = "MF-1 Modes FM-1"
# The engine is iScream's port of MF-1's. Each mode's own C port and its scene (a copy of the desktop app's) are
# separate units, so their names never meet.
include = ["../iscream/dsp", "../almanac/dsp", "../woof/dsp"]
o2 = ["../iscream/dsp/fm.c", "../iscream/dsp/fx.c", "../iscream/dsp/synth.c",
      "../almanac/dsp/alm.c", "../almanac/dsp/scene.c", "../woof/dsp/wf.c", "../woof/dsp/scene.c"]
o2_cflags = ["-DISC_FASTMATH"]
words = "words.tsv"
ble = false
# the site and firmware hubs (docs/FIRMWARE-JSON.md)
tagline = "MF-1's modes, chosen at power-on"
repo = "https://github.com/IanButterworth/mf-1"
licence = "MIT"
credits = "Built on fm1-base and felucca-bsp (MPL-2.0); FM engine from msfa (Apache-2.0) by way of MF-1."
author = "The MF-1 authors"
description = "MF-1's modes in one firmware: Almanac, the year as twelve sounds, and Woof, a dog show with every key a bark. Hold a piano key while switching on to choose; otherwise the last mode used starts."
tags = ["synth"]
