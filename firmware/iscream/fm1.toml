# iScream's firmware build settings (fm1-base's tools/build.py)
name = "ISCREAM"
id_prefix = "FM-1_47"          # package identity: dev FM-1_4700, releases FM-1_47XXYYZZ
usb_manufacturer = "MF-1"
usb_product = "iScream FM-1"
include = ["dsp"]
o2 = ["dsp/fm.c", "dsp/fx.c", "dsp/synth.c"]
o2_cflags = ["-DISC_FASTMATH"]
words = "words.tsv"
ble = false
# the site and firmware hubs (docs/FIRMWARE-JSON.md)
tagline = "a small synth made of ice cream"
repo = "https://github.com/IanButterworth/mf-1"
licence = "MIT"
credits = "Built on fm1-base and felucca-bsp (MPL-2.0); FM engine from msfa (Apache-2.0) by way of MF-1."
author = "The MF-1 authors"
description = "Twelve flavors of FM sound, a cone for a filter and five toppings for effects. Turn FLAVOR for a sound and the knobs to shape it; the screen draws the sundae you are building."
tags = ["synth"]
